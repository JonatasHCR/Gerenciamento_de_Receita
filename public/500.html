<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Erro interno (500) — UFC Engenharia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        padding: 1.5rem; background: #f9fafb; color: #1f2937;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .card {
        width: 100%; max-width: 28rem; background: #fff;
        border: 1px solid #e5e7eb; border-radius: 0.75rem;
        padding: 2rem; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,.04);
      }
      .logo {
        width: 3rem; height: 3rem; border-radius: 0.6rem; background: #b91c1c;
        color: #fff; font-weight: 700; font-size: .8rem;
        display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1.25rem;
      }
      .code { font-size: 3rem; font-weight: 800; color: #b91c1c; line-height: 1; }
      h1 { font-size: 1.1rem; margin: .75rem 0 .25rem; }
      p { color: #6b7280; font-size: .9rem; margin: 0 0 1.5rem; }
      a.btn {
        display: inline-block; background: #b91c1c; color: #fff; text-decoration: none;
        font-size: .9rem; font-weight: 600; padding: .6rem 1.25rem; border-radius: 0.6rem;
      }
      a.btn:hover { background: #991b1b; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">UFC</div>
      <div class="code">500</div>
      <h1>Algo deu errado</h1>
      <p>Tivemos um problema ao processar sua solicitação. Tente novamente em instantes; se persistir, avise o administrador.</p>
      <a class="btn" href="/">Voltar ao início</a>
    </div>
  </body>
</html>
