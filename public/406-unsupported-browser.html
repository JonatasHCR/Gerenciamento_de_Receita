<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <title>Navegador não suportado — UFC Engenharia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
        padding: 1.5rem; background: #f9fafb; color: #1f2937;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .card {
        width: 100%; max-width: 30rem; background: #fff;
        border: 1px solid #e5e7eb; border-radius: 0.75rem;
        padding: 2rem; text-align: center; box-shadow: 0 1px 2px rgba(0,0,0,.04);
      }
      .logo {
        width: 3rem; height: 3rem; border-radius: 0.6rem; background: #b91c1c;
        color: #fff; font-weight: 700; font-size: .8rem;
        display: inline-flex; align-items: center; justify-content: center; margin-bottom: 1.25rem;
      }
      h1 { font-size: 1.25rem; margin: .5rem 0 .5rem; color: #b91c1c; }
      p { color: #6b7280; font-size: .92rem; margin: 0 0 1rem; line-height: 1.5; }
      .browsers { color: #374151; font-size: .85rem; margin-top: .5rem; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">UFC</div>
      <h1>Navegador não suportado</h1>
      <p>
        Seu navegador é antigo demais para abrir o sistema de gerenciamento de receitas
        com segurança. Atualize para uma versão recente, ou use outro navegador.
      </p>
      <p class="browsers">Recomendados: Google Chrome, Microsoft Edge, Mozilla Firefox ou Safari (versões atuais).</p>
    </div>
  </body>
</html>
