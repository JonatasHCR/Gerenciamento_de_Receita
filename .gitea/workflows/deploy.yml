name: Deploy

# Dispara só ao integrar na branch principal. O deploy depende do CI passar.
on:
  push:
    branches: [main, master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no registry do Gitea
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_HOST }}        # ex.: gitea.suaempresa.com
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build e push da imagem de produção
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.REGISTRY_HOST }}/${{ github.repository }}:latest
            ${{ secrets.REGISTRY_HOST }}/${{ github.repository }}:${{ github.sha }}

      - name: Deploy no servidor via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}            # ex.: /opt/gerencimento_receita
            COMPOSE="docker compose -f docker-compose.prod.yml"

            # Carrega o .env de produção (WEB_PORT, WEB_IMAGE, etc.) no shell.
            set -a; [ -f .env ] && . ./.env; set +a

            # Imagem atualmente em execução — guardada para rollback.
            PREV_IMAGE="$(docker inspect --format '{{.Image}}' "$($COMPOSE ps -q web 2>/dev/null)" 2>/dev/null || true)"

            # 1) Backup do banco ANTES do deploy.
            mkdir -p backups
            $COMPOSE exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' \
              > "backups/predeploy_$(date +%Y%m%d_%H%M%S).dump" \
              && echo "Backup pré-deploy concluído." || { echo "Backup pré-deploy FALHOU — abortando."; exit 1; }

            # 2) Atualiza a imagem e sobe.
            echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ secrets.REGISTRY_HOST }} -u ${{ secrets.REGISTRY_USER }} --password-stdin
            $COMPOSE pull
            $COMPOSE up -d
            $COMPOSE run --rm web bin/rails db:migrate

            # 3) Healthcheck pós-deploy (endpoint /up do Rails).
            ok=0
            for i in $(seq 1 15); do
              if curl -fsS "http://localhost:${WEB_PORT:-80}/up" >/dev/null 2>&1; then ok=1; break; fi
              sleep 4
            done

            if [ "$ok" != "1" ]; then
              echo "❌ Healthcheck FALHOU — app não respondeu em /up."
              $COMPOSE logs --tail=60 web || true
              if [ -n "$PREV_IMAGE" ]; then
                echo "↩️  Revertendo para a imagem anterior ($PREV_IMAGE)..."
                WEB_IMAGE="$PREV_IMAGE" $COMPOSE up -d web
              fi
              exit 1
            fi

            echo "✅ Deploy OK — app respondendo em /up."
            docker image prune -f   # só limpa imagens antigas após sucesso

# ─────────────────────────────────────────────────────────────────────────────
# Secrets necessários (Settings → Actions → Secrets do repositório/organização):
#   REGISTRY_HOST   host do registry (normalmente o próprio Gitea)
#   REGISTRY_USER   usuário com permissão de push no registry
#   REGISTRY_TOKEN  token/senha do registry
#   DEPLOY_HOST     IP/hostname do servidor de produção
#   DEPLOY_USER     usuário SSH
#   DEPLOY_SSH_KEY  chave privada SSH (conteúdo)
#   DEPLOY_PATH     caminho no servidor com o docker-compose.prod.yml e o .env de produção
# ─────────────────────────────────────────────────────────────────────────────
