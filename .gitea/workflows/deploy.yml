name: Deploy

# Dispara só ao integrar na branch principal. O deploy depende do CI passar.
# Cenário: UMA máquina faz tudo (Gitea + runner + produção). A imagem é construída
# localmente no servidor — NÃO há registry. O runner roda no próprio servidor.
on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy no servidor
        run: |
          set -e
          cd "${DEPLOY_PATH}"
          COMPOSE="docker compose -f docker-compose.prod.yml"

          # Carrega o .env de produção (WEB_PORT, POSTGRES_*, etc.) no shell.
          set -a; [ -f .env ] && . ./.env; set +a

          # Commit atualmente publicado — guardado para rollback.
          PREV_SHA="$(git rev-parse HEAD)"

          # 1) Backup do banco ANTES do deploy.
          mkdir -p backups
          $COMPOSE exec -T db sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' \
            > "backups/predeploy_$(date +%Y%m%d_%H%M%S).dump" \
            && echo "Backup pré-deploy concluído." || { echo "Backup pré-deploy FALHOU — abortando."; exit 1; }

          # 2) Atualiza o código, builda a imagem local e sobe.
          git fetch origin
          git reset --hard "${GITHUB_SHA}"
          $COMPOSE up -d --build
          $COMPOSE run --rm web bin/rails db:migrate

          # 3) Healthcheck pós-deploy (endpoint /up do Rails).
          ok=0
          for i in $(seq 1 15); do
            if curl -fsS "http://localhost:${WEB_PORT:-80}/up" >/dev/null 2>&1; then ok=1; break; fi
            sleep 4
          done

          if [ "$ok" != "1" ]; then
            echo "❌ Healthcheck FALHOU — app não respondeu em /up."
            $COMPOSE logs --tail=60 web || true
            echo "↩️  Revertendo para o commit anterior (${PREV_SHA})..."
            git reset --hard "${PREV_SHA}"
            $COMPOSE up -d --build
            exit 1
          fi

          echo "✅ Deploy OK — app respondendo em /up."
          docker image prune -f   # só limpa imagens órfãs após sucesso
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GITHUB_SHA: ${{ github.sha }}

# ─────────────────────────────────────────────────────────────────────────────
# Pré-requisitos (uma máquina só — sem registry):
#   • O act_runner roda NO servidor, com acesso ao docker.sock do host e à pasta
#     DEPLOY_PATH (onde fica o clone do repo + docker-compose.prod.yml + .env).
#   • DEPLOY_PATH precisa ser um clone git do repositório, com o remote `origin`
#     apontando para o Gitea, e conter o .env de produção preenchido.
#
# Secret necessário (Settings → Actions → Secrets do repositório):
#   DEPLOY_PATH   caminho no servidor com o docker-compose.prod.yml e o .env
#                 (ex.: /opt/gerencimento_receita)
# ─────────────────────────────────────────────────────────────────────────────
