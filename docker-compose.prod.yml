# Compose de PRODUÇÃO (fica no servidor, em DEPLOY_PATH).
# A imagem é CONSTRUÍDA localmente no próprio servidor (sem registry) — o repo é
# clonado/atualizado em DEPLOY_PATH e o deploy faz `up -d --build`.
# Variáveis sensíveis vêm de um arquivo .env (não versionado) ao lado deste.
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-receita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: ${POSTGRES_DB:-receita_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-receita} -d ${POSTGRES_DB:-receita_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backup diário automático (sidecar): gera dump via pg_dump no horário BACKUP_HOUR.
  backup:
    image: postgres:16
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_USER: ${POSTGRES_USER:-receita}
      POSTGRES_DB: ${POSTGRES_DB:-receita_production}
      DB_HOST: db
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-12}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./scripts/backup_loop.sh:/backup_loop.sh:ro
      - ./backups:/backups
    entrypoint: ["bash", "/backup_loop.sh"]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: gerencimento_receita:latest   # tag local da imagem construída
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      DATABASE_URL: ${DATABASE_URL:?defina no .env}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?defina no .env}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
    ports:
      - "${WEB_PORT:-80}:80"   # Thruster expõe 80 dentro do container

volumes:
  postgres_data:
