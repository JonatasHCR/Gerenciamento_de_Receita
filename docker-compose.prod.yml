# Compose de PRODUÇÃO (fica no servidor, em DEPLOY_PATH).
# A imagem é CONSTRUÍDA localmente no próprio servidor (sem registry) — o repo é
# clonado/atualizado em DEPLOY_PATH e o deploy faz `up -d --build`.
# Variáveis sensíveis vêm de um arquivo .env (não versionado) ao lado deste.
services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-receita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_DB: ${POSTGRES_DB:-receita_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-receita} -d ${POSTGRES_DB:-receita_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backup diário automático (sidecar): gera dump via pg_dump no horário BACKUP_HOUR.
  backup:
    image: postgres:16
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina no .env}
      POSTGRES_USER: ${POSTGRES_USER:-receita}
      POSTGRES_DB: ${POSTGRES_DB:-receita_production}
      DB_HOST: db
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-12}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./scripts/backup_loop.sh:/backup_loop.sh:ro
      - ./backups:/backups
    # Tolerante a CRLF: normaliza \r antes de rodar (checkout Windows quebraria com
    # "$'\r': command not found"). O mount é :ro, então roda uma cópia limpa.
    entrypoint: ["bash", "-c", "exec bash <(sed 's/\\r$//' /backup_loop.sh)"]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: gerencimento_receita:latest   # tag local da imagem construída
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      DATABASE_URL: ${DATABASE_URL:?defina no .env}
      RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?defina no .env}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      # Admin inicial criado pelo seed (db:prepare no 1º boot). Sem senha = sem admin.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${WEB_PORT:-80}:80"   # Thruster expõe 80 dentro do container
    healthcheck:
      # curl já vem na imagem de produção; /up é o endpoint de saúde do Rails.
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s   # tempo de boot (db:prepare + Thruster) antes de contar falhas

volumes:
  postgres_data:
