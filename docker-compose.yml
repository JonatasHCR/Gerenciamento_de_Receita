services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: receita
      POSTGRES_PASSWORD: receita
      POSTGRES_DB: receita_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receita -d receita_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    # Garante que novos gems sejam instalados (no volume persistente) antes de subir.
    command: bash -c "bundle check || bundle install; bin/dev"
    ports:
      - "0.0.0.0:3040:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    volumes:
      - .:/rails
      # Volumes nomeados: gems e bootsnap persistem entre recriações de container
      # (evita reinstalar tudo e o "gem some ao recriar" — ex.: prawn).
      - bundle_cache:/usr/local/bundle
      - bootsnap_cache:/rails/tmp/cache/bootsnap
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  bundle_cache:
  bootsnap_cache:
