services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: receita
      POSTGRES_PASSWORD: receita
      POSTGRES_DB: receita_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U receita -d receita_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backup diário automático (sidecar) — gera dump em ./backups no horário BACKUP_HOUR.
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: receita
      POSTGRES_USER: receita
      POSTGRES_DB: receita_dev
      DB_HOST: db
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-12}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./scripts/backup_loop.sh:/backup_loop.sh:ro
      - ./backups:/backups
    entrypoint: ["bash", "-c", "exec bash <(sed 's/\\r$//' /backup_loop.sh)"]

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    command: bash -c "bundle check || bundle install; bin/rails db:prepare; (while true; do bin/rails tailwindcss:watch; echo '[css] watcher caiu, reiniciando em 1s'; sleep 1; done) & exec bin/rails server -b 0.0.0.0 -p 3000"
    ports:
      - "0.0.0.0:3040:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
      - bootsnap_cache:/rails/tmp/cache/bootsnap
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  bundle_cache:
  bootsnap_cache:
