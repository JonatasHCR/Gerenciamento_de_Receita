# act_runner do Gitea — roda na MESMA máquina do Gitea/produção (servidor único).
#
# Passos:
#   1. (no servidor) entre nesta pasta `runner/`.
#   2. Crie um runner.env (veja runner.env.example) com a URL do Gitea e o TOKEN.
#   3. docker compose up -d   (a 1ª subida registra o runner no Gitea)
#
# O runner precisa de Docker (os jobs rodam em containers) e alcançar o Gitea.
services:
  act_runner:
    image: gitea/act_runner:latest
    restart: always
    env_file: runner.env
    environment:
      CONFIG_FILE: /config.yaml
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./data:/data
      # Acesso ao Docker do host (os jobs sobem containers: ruby, postgres, build de imagem).
      - /var/run/docker.sock:/var/run/docker.sock
