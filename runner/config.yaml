# Configuração do act_runner.
log:
  level: info

runner:
  file: /data/.runner
  capacity: 2            # quantos jobs em paralelo
  timeout: 3h
  # A label DEVE bater com o `runs-on:` dos workflows (ubuntu-latest).
  labels:
    - "ubuntu-latest:docker://catthehacker/ubuntu:act-22.04"

cache:
  enabled: true

container:
  # Vazio = rede padrão. Os containers de job conseguem falar com os services
  # (ex.: postgres) e com o Docker do host (socket montado no compose).
  network: ""
  privileged: false
  # Monta no container do job a pasta de deploy NO MESMO CAMINHO do host — para que
  # os bind-mounts do docker-compose.prod.yml (./backups, ./scripts/...) e o build
  # context resolvam corretamente no daemon do host (deve ser == DEPLOY_PATH).
  #
  # NÃO montar o /var/run/docker.sock aqui: o act_runner já injeta o socket do Docker
  # do host em cada container de job automaticamente. Montá-lo de novo causa
  # "Error response from daemon: Duplicate mount point: /var/run/docker.sock".
  options: "-v /opt/gerencimento_receita:/opt/gerencimento_receita"
  valid_volumes:
    - /var/run/docker.sock
    - /opt/gerencimento_receita
